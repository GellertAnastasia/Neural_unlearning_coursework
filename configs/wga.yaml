model:
  lora_path: "./adapter"
  
data:
  forget_path: "./data/forget.jsonl"
  retain_path: "./data/retain.jsonl"
  
training:
  type: "WeightedGradAscentTrainer"
  output_dir: "./wga_model"
  seed: 42
  num_epochs: 5
  batch_size: 2
  learning_rate: 0.00002
  logging_steps: 10
  save_steps: 100

  max_grad_norm: 0.5
  warmup_steps: 50
  weight_decay: 0.01
  eval_steps: 200
  gradient_accumulation_steps: 8

  beta: 0.5